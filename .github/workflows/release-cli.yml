name: Release CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the crate version
        shell: bash
        run: |
          crate=$(grep -m1 '^version' cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          test "cli-v${crate}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != cli-v${crate}"; exit 1; }
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
      - name: Package
        shell: bash
        run: |
          cp "cli/target/${{ matrix.target }}/release/veil" "veil-${{ matrix.target }}"
          ./veil-${{ matrix.target }} --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-${{ matrix.target }}
          path: veil-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: veil-*
          merge-multiple: true
      - run: sha256sum veil-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          gh release create "${GITHUB_REF_NAME}" veil-* SHA256SUMS \
            --title "veil CLI ${version}" \
            --notes "Prebuilt \`veil\` binaries for macOS and Linux (arm64, x86_64).

          Install with Homebrew: \`brew install maxgfr/tap/veil\`, or download the binary for your platform and check it against SHA256SUMS."
