[package]
name = "veil-cli"
version = "0.2.0"
edition = "2021"
description = "Command-line client for Veil rooms: send and receive files, and chat, peer-to-peer and end-to-end encrypted"
license = "MIT"
repository = "https://github.com/maxgfr/veil"
rust-version = "1.85"

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
webrtc = "=0.20.5"
rtc = "=0.20.5"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.13", features = ["schnorr"] }
rand = "0.8"
flate2 = "1"
clap = { version = "4", features = ["derive", "env"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
anyhow = "1"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
